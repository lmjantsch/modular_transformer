[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-transformer"
version = "0.1.0"
description = "Conservation-preserving gradient attribution for HuggingFace transformers via in-place backward-pass patching"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Lasse Jantsch", email = "lassejantsch@web.de"}
]
license = {text = "MIT"}
keywords = ["transformers", "attribution", "interpretability", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "nnsight>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modular_transformer = ["py.typed"]
